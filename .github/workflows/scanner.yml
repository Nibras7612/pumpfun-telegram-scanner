
name: Pump.fun Telegram Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pumpfun-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install websockets==12.0 requests

      - name: Scan new Pump.fun tokens
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio, json, os, time, requests, websockets

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT = os.environ["TELEGRAM_CHAT_ID"]
          END = time.time() + 190
          SENT = set()

          def get_market(mint):
              try:
                  url = f"https://api.dexscreener.com/token-pairs/v1/solana/{mint}"
                  r = requests.get(url, timeout=8)
                  r.raise_for_status()
                  pairs = r.json()
                  if not isinstance(pairs, list) or not pairs:
                      return None
                  return max(
                      pairs,
                      key=lambda p: (p.get("liquidity") or {}).get("usd", 0) or 0
                  )
              except Exception:
                  return None

          def get_risk(mint):
              try:
                  url = f"https://api.rugcheck.xyz/v1/tokens/{mint}/report"
                  r = requests.get(url, timeout=12,
                                   headers={"Accept": "application/json"})
                  r.raise_for_status()
                  return r.json()
              except Exception:
                  return None

          def fmt(value):
              try:
                  return f"${float(value):,.0f}"
              except Exception:
                  return "Not available"

          def alert(data):
              mint = data.get("mint", "")
              if not mint or mint in SENT:
                  return
              SENT.add(mint)

              name = data.get("name", "Unknown")
              symbol = data.get("symbol", "")
              cap = data.get("marketCapSol", "N/A")

              pair = get_market(mint)
              if pair:
                  liquidity = fmt((pair.get("liquidity") or {}).get("usd"))
                  marketcap = fmt(pair.get("marketCap") or pair.get("fdv"))
                  dex = pair.get("url", "")
              else:
                  liquidity = "Not available yet"
                  marketcap = "Not available yet"
                  dex = ""

              risk = get_risk(mint)
              if risk:
                  score = risk.get("score_normalised",
                                   risk.get("score", "N/A"))
                  risks = risk.get("risks") or []
                  risk_names = [x.get("name", "Risk")
                                for x in risks[:3]]
                  risk_text = ", ".join(risk_names) if risk_names else "No risks listed"
                  holders = risk.get("topHolders") or []
                  holder_text = ", ".join(
                      f"{float(h.get('pct', 0)):.1f}%"
                      for h in holders[:5]
                      if h.get("pct") is not None
                  ) or "Not available"
              else:
                  score = "Not available"
                  risk_text = "Report unavailable"
                  holder_text = "Not available"

              msg = (
                  "🚀 NEW PUMP.FUN TOKEN\n\n"
                  f"Name: {name}\n"
                  f"Symbol: {symbol}\n"
                  f"Market Cap (SOL): {cap}\n"
                  f"DEX Market Cap: {marketcap}\n"
                  f"Liquidity: {liquidity}\n\n"
                  f"RugCheck Score: {score}\n"
                  f"Risk Flags: {risk_text}\n"
                  f"Top Holder percentages: {holder_text}\n\n"
                  f"Contract:\n{mint}\n"
                  f"https://pump.fun/coin/{mint}"
              )
              if dex:
                  msg += f"\nDEX: {dex}"

              requests.post(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  json={"chat_id": CHAT, "text": msg},
                  timeout=15
              ).raise_for_status()

          async def main():
              uri = "wss://pumpportal.fun/api/data"
              async with websockets.connect(
                  uri, ping_interval=20, ping_timeout=20
              ) as ws:
                  await ws.send(json.dumps({
                      "method": "subscribeNewToken"
                  }))
                  print("Scanner connected")

                  while time.time() < END:
                      try:
                          raw = await asyncio.wait_for(
                              ws.recv(), timeout=20
                          )
                          data = json.loads(raw)
                          if isinstance(data, dict):
                              alert(data)
                      except asyncio.TimeoutError:
                          continue

          asyncio.run(main())
          PY
